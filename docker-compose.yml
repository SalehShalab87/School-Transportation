services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: backend-template-postgres
    environment:
      POSTGRES_DB: backend_template
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - backend_template_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d backend_template"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  backend_template_pgdata:
